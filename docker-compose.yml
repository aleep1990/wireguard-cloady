# WireGuard VPN server for Cloady (free tier / trial workspace)
# Deploy: paste https://github.com/aleep1990/wireguard-cloady into Cloady Deploy,
# workspace aleep1990, region ind1 (India), environment production.
# No secrets in this repo: keys are generated at runtime by the container
# and live in the named volume wg-config.
---
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:1.0.20260223
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tehran
      - SERVERURL=SET-AFTER-DEPLOY
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
      - LOG_CONFS=true
    volumes:
      - wg-config:/config
    ports:
      - "51820:51820/udp"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  wg-config:
